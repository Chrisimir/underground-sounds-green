<h1>Almost done</h1>
<p>Copy this address and paste it into the dashboard's TikTok <b>Finish connecting</b> box:</p>
<textarea id="u" readonly rows="5" style="width:100%;background:#1a1b20;color:#e8e8ea;border:1px solid #333;border-radius:8px;padding:8px;font:13px monospace"></textarea>
<p><button id="c" style="background:#3ddc84;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer">Copy</button> <span id="m" class="muted"></span></p>
<script>
var u=document.getElementById('u'); u.value=location.href;
document.getElementById('c').onclick=function(){u.select();try{document.execCommand('copy');document.getElementById('m').textContent='Copied';}catch(e){}};
</script>
